[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "options-pricer"
version = "0.1.0"
description = "Analytic and Monte Carlo pricing for vanilla options."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Fabrizio Donati" }
]
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pytest>=8.3",
  "ruff>=0.6"
]

[project.scripts]
optprice = "options_pricer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/options_pricer"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["options_pricer"]

